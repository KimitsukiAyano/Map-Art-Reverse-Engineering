plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu is optional at runtime: the config screen only shows up when it is installed.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def expansions = [
			version          : project.version.toString(),
			minecraft_version: project.minecraft_version,
			loader_version   : project.loader_version
	]
	inputs.properties expansions

	filesMatching('fabric.mod.json') {
		expand expansions
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def archiveName = project.archives_base_name

jar {
	from('LICENSE') {
		rename { "${it}_${archiveName}" }
	}
}

// End-to-end test that starts a real client, makes a world and lets the mod fish:
//   ./gradlew runClientGameTest   (needs a display; use xvfb-run on a headless machine)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'simpleautofish-test'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
